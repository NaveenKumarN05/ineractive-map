<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>World Map Explorer</title>
<style>
  :root {
    --ocean: #dbe9f4;
    --land: #f4f1ea;
    --land-hover: #ffd9a8;
    --land-selected: #f08c3a;
    --border: #9aa5b1;
    --text: #1f2933;
    --muted: #616e7c;
    --panel: #ffffff;
    --land-seen: #8fc9a8;
    --chip: #eef2f6;
    --good: #2fa36b;
    --bad: #e05252;
    --good-text: #1f7a4d;
    --bad-text: #c03b3b;
    --shadow: 0 8px 28px rgba(15, 30, 50, .18);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ocean: #0b1520;
      --land: #3a4a5c;
      --land-hover: #7a5530;
      --land-selected: #f08c3a;
      --border: #66788a;
      --text: #e9eef3;
      --muted: #9aa8b6;
      --panel: #1a2430;
      --land-seen: #2f7a5a;
      --chip: #263241;
      --good: #3cbf7f;
      --bad: #e86363;
      --good-text: #6fdba5;
      --bad-text: #ff8a8a;
      --shadow: 0 8px 28px rgba(0, 0, 0, .5);
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--ocean);
    color: var(--text);
  }
  #map { width: 100vw; height: 100vh; display: block; cursor: grab; touch-action: none; }
  #map:active { cursor: grabbing; }
  .country {
    fill: var(--land);
    stroke: var(--border);
    stroke-linejoin: round;
    vector-effect: non-scaling-stroke;
    stroke-width: .6px;
    cursor: pointer;
    transition: fill .15s;
  }
  .country:hover { fill: var(--land-hover); }
  .country.selected { fill: var(--land-selected); }

  header {
    position: fixed; top: 16px; left: 16px;
    background: var(--panel); box-shadow: var(--shadow);
    border-radius: 12px; padding: 10px 14px;
    pointer-events: none;
  }
  header h1 { margin: 0; font-size: 16px; }
  header p { margin: 2px 0 0; font-size: 12px; color: var(--muted); }

  .controls {
    position: fixed; right: 16px; top: 16px;
    display: flex; flex-direction: column; gap: 6px;
  }
  .controls button {
    width: 40px; height: 40px; border: 0; border-radius: 10px;
    background: var(--panel); color: var(--text); box-shadow: var(--shadow);
    font-size: 20px; cursor: pointer;
  }
  .controls button:hover { filter: brightness(.95); }

  #info {
    position: fixed; left: 16px; bottom: 16px;
    width: min(340px, calc(100vw - 32px));
    background: var(--panel); box-shadow: var(--shadow);
    border-radius: 14px; padding: 16px 18px;
    transform: translateY(20px); opacity: 0; pointer-events: none;
    transition: opacity .2s, transform .2s;
  }
  #info.show { transform: none; opacity: 1; pointer-events: auto; }
  #info .flag { font-size: 34px; line-height: 1; }
  #info h2 { margin: 6px 0 2px; font-size: 22px; }
  #info .official { color: var(--muted); font-size: 13px; margin-bottom: 12px; }
  #info dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; font-size: 15px; }
  #info dt { color: var(--muted); }
  #info dd { margin: 0; font-weight: 600; }
  #info .actions { position: absolute; top: 10px; right: 10px; display: flex; gap: 4px; }
  #info .actions button {
    width: 32px; height: 32px; border: 0; border-radius: 8px;
    background: none; color: var(--muted); font-size: 18px; cursor: pointer;
    display: grid; place-items: center;
  }
  #info .actions button:hover { background: var(--chip); color: var(--text); }
  #info .speak.speaking { color: var(--land-selected); }

  .country.seen { fill: var(--land-seen); }
  .country.seen:hover { fill: var(--land-hover); }
  .country.selected, .country.selected:hover { fill: var(--land-selected); }

  #options {
    position: fixed; right: 16px; bottom: 16px;
    width: 240px; max-width: calc(100vw - 32px);
    background: var(--panel); box-shadow: var(--shadow);
    border-radius: 14px; padding: 12px 14px; font-size: 13px;
  }
  #options label { display: flex; align-items: center; gap: 8px; padding: 3px 0; cursor: pointer; }
  #options .legend { margin: 8px 0 4px; display: grid; gap: 4px; color: var(--muted); }
  #options .legend span { display: flex; align-items: center; gap: 8px; }
  #options .sw { width: 14px; height: 14px; border-radius: 4px; border: 1px solid var(--border); }
  #options .foot { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; color: var(--muted); }
  #options .foot button {
    border: 0; background: var(--chip); color: var(--text);
    border-radius: 6px; padding: 4px 8px; font-size: 12px; cursor: pointer;
  }
  #options.no-seen .legend .seen-row { opacity: .4; }
  #voice-settings { margin: 4px 0 6px 22px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 4px; }
  #voice-settings .voice-row { display: flex; gap: 6px; }
  #voice-settings select {
    flex: 1; min-width: 0; font: inherit; font-size: 12px;
    background: var(--chip); color: var(--text);
    border: 1px solid var(--border); border-radius: 6px; padding: 3px 4px;
  }
  #voice-settings button {
    border: 0; background: var(--chip); color: var(--text);
    border-radius: 6px; width: 28px; font-size: 11px; cursor: pointer;
  }
  #voice-settings .slider { justify-content: space-between; color: var(--muted); font-size: 12px; }
  #voice-settings input[type=range] { width: 110px; accent-color: var(--land-selected); }
  #options.voice-off #voice-settings { display: none; }
  @media (max-width: 640px) {
    #options { display: none; }
    header p { display: none; }
  }

  #info .hint { margin-top: 10px; font-size: 12px; color: var(--muted); }
  #info .hint:empty { display: none; }

  /* Drill-down */
  .subregion {
    fill: var(--land);
    stroke: var(--border);
    stroke-linejoin: round;
    vector-effect: non-scaling-stroke;
    stroke-width: .5px;
    cursor: pointer;
    transition: fill .15s;
  }
  .subregion:hover { fill: var(--land-hover); }
  .subregion.seen { fill: var(--land-seen); }
  .subregion.seen:hover { fill: var(--land-hover); }
  .subregion.selected, .subregion.selected:hover { fill: var(--land-selected); }
  #map.drilled .country:not(.drill-parent) { opacity: .45; }
  #map.drilled .country.drill-parent { stroke-width: 1.4px; }

  #crumbs {
    position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
    display: none; align-items: center; gap: 6px;
    background: var(--panel); box-shadow: var(--shadow);
    border-radius: 999px; padding: 6px 12px; font-size: 13px;
    max-width: calc(100vw - 140px); white-space: nowrap; overflow: hidden;
  }
  #crumbs.show { display: flex; }
  #crumbs button {
    border: 0; background: none; color: var(--land-selected);
    font: inherit; font-weight: 600; cursor: pointer; padding: 0;
  }
  #crumbs span { font-weight: 600; }
  #crumbs .sep { color: var(--muted); font-weight: 400; }
  @media (max-width: 900px) { #crumbs { top: 76px; } }
  @media (max-width: 640px) { #crumbs { top: 120px; left: 16px; transform: none; max-width: calc(100vw - 88px); } }

  /* Modes */
  header .modes {
    pointer-events: auto; margin-top: 8px;
    display: inline-flex; background: var(--chip); border-radius: 999px; padding: 3px;
  }
  .modes button {
    border: 0; background: none; color: var(--muted);
    font: inherit; font-size: 13px; font-weight: 600;
    padding: 5px 12px; border-radius: 999px; cursor: pointer;
  }
  .modes button[aria-pressed="true"] { background: var(--panel); color: var(--text); box-shadow: 0 1px 4px rgba(0,0,0,.2); }
  body.test header p { visibility: hidden; height: 0; margin: 0; }
  body.test #info, body.test #crumbs, body.test .learn-only { display: none !important; }

  /* Quiz marks on the map */
  .country.quiz-target, .subregion.quiz-target { fill: var(--land-selected) !important; animation: pulse 1.2s ease-in-out infinite; }
  .country.quiz-correct, .subregion.quiz-correct { fill: var(--good) !important; }
  .country.quiz-wrong, .subregion.quiz-wrong { fill: var(--bad) !important; }
  @keyframes pulse { 50% { opacity: .55; } }

  /* Quiz panel */
  #quiz {
    position: fixed; left: 16px; bottom: 16px;
    width: min(360px, calc(100vw - 32px));
    background: var(--panel); box-shadow: var(--shadow);
    border-radius: 16px; padding: 16px 18px;
    display: none;
  }
  #quiz.show { display: block; }
  #quiz > div { display: none; }
  #quiz[data-state="setup"] .st-setup,
  #quiz[data-state="question"] .st-question,
  #quiz[data-state="done"] .st-done { display: block; }
  #quiz h2 { margin: 0 0 10px; font-size: 18px; }
  #quiz .group-label { font-size: 12px; color: var(--muted); margin: 10px 0 4px; }
  #quiz .seg { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  #quiz button { font: inherit; cursor: pointer; }
  #quiz .seg button, #quiz .choices button {
    border: 2px solid transparent; background: var(--chip); color: var(--text);
    border-radius: 10px; padding: 8px; font-size: 13px; font-weight: 600;
  }
  #quiz .seg button[aria-pressed="true"] { border-color: var(--land-selected); }
  #quiz .primary {
    border: 0; background: var(--land-selected); color: #1b1006;
    border-radius: 10px; padding: 9px 16px; font-weight: 700; font-size: 14px;
  }
  #quiz .st-setup .primary { width: 100%; margin-top: 14px; }
  #quiz .link { border: 0; background: none; color: var(--muted); padding: 6px 0; font-size: 13px; }
  #quiz .top { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); }
  #quiz .score { font-weight: 700; color: var(--text); }
  #quiz .prompt-row { display: flex; align-items: center; gap: 10px; margin: 8px 0 2px; }
  #quiz .prompt-row .flag { font-size: 30px; line-height: 1; }
  #quiz .prompt { flex: 1; font-size: 19px; line-height: 1.25; }
  #quiz .repeat {
    border: 0; background: var(--chip); color: var(--text);
    width: 34px; height: 34px; border-radius: 8px; display: grid; place-items: center;
  }
  #quiz .hint { font-size: 12px; color: var(--muted); }
  #quiz .choices { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 10px; }
  #quiz .choices:empty { display: none; }
  #quiz .choices button { font-size: 14px; padding: 10px 6px; }
  #quiz .choices button:disabled { cursor: default; opacity: .6; }
  #quiz .choices button.right { border-color: var(--good); background: color-mix(in srgb, var(--good) 25%, var(--chip)); opacity: 1; }
  #quiz .choices button.wrong { border-color: var(--bad); background: color-mix(in srgb, var(--bad) 25%, var(--chip)); opacity: 1; }
  #quiz .feedback { margin-top: 10px; font-weight: 600; font-size: 14px; min-height: 1px; }
  #quiz .feedback:empty { margin: 0; }
  #quiz .feedback.good { color: var(--good-text); }
  #quiz .feedback.bad { color: var(--bad-text); }
  #quiz .bottom { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; }
  #quiz .stars { font-size: 40px; color: var(--land-selected); letter-spacing: 4px; text-align: center; }
  #quiz .result { text-align: center; font-size: 20px; font-weight: 700; margin-top: 4px; }
  #quiz .result-msg { text-align: center; color: var(--muted); margin-top: 4px; }

  #tooltip {
    position: fixed; pointer-events: none;
    background: var(--panel); color: var(--text); box-shadow: var(--shadow);
    padding: 4px 8px; border-radius: 6px; font-size: 13px;
    opacity: 0; transition: opacity .1s; white-space: nowrap;
  }
</style>
</head>
<body>
<svg id="map"></svg>

<header>
  <h1>World Map Explorer</h1>
  <p>Drag to move · Scroll or pinch to zoom · Click a country</p>
  <div class="modes" role="group" aria-label="Mode">
    <button data-mode="learn" aria-pressed="true">📖 Learn</button>
    <button data-mode="test" aria-pressed="false">🎯 Test</button>
  </div>
</header>

<div class="controls">
  <button id="zoom-in" title="Zoom in" aria-label="Zoom in">+</button>
  <button id="zoom-out" title="Zoom out" aria-label="Zoom out">−</button>
  <button id="zoom-reset" title="Reset view" aria-label="Reset view">⟲</button>
</div>

<div id="info" role="dialog" aria-live="polite">
  <div class="actions">
    <button class="speak" title="Read aloud" aria-label="Read aloud"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z" fill="currentColor"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg></button>
    <button class="close" title="Close" aria-label="Close">×</button>
  </div>
  <div class="flag"></div>
  <h2 class="name"></h2>
  <div class="official"></div>
  <dl>
    <dt>Capital</dt><dd class="capital"></dd>
    <dt class="region-label">Region</dt><dd class="region"></dd>
  </dl>
  <div class="hint"></div>
</div>
<div id="tooltip"></div>
<nav id="crumbs" aria-label="Location"></nav>

<div id="options">
  <label><input type="checkbox" id="opt-voice" checked> Read aloud on select</label>
  <div id="voice-settings">
    <div class="voice-row">
      <select id="opt-voice-name" aria-label="Voice"></select>
      <button id="voice-test" title="Try this voice" aria-label="Try this voice">▶</button>
    </div>
    <label class="slider">Pitch <input type="range" id="opt-pitch" min="0.5" max="2" step="0.1" value="1"></label>
    <label class="slider">Speed <input type="range" id="opt-rate" min="0.5" max="1.5" step="0.05" value="0.95"></label>
  </div>
  <div class="learn-only">
  <label><input type="checkbox" id="opt-seen" checked> Highlight seen countries</label>
  <div class="legend">
    <span><i class="sw" style="background:var(--land-selected)"></i> Current</span>
    <span class="seen-row"><i class="sw" style="background:var(--land-seen)"></i> Seen</span>
    <span><i class="sw" style="background:var(--land)"></i> Unseen</span>
  </div>
  <div class="foot">
    <span id="seen-count">Seen 0</span>
    <button id="seen-reset">Reset seen</button>
  </div>
  </div>
</div>

<section id="quiz" aria-live="polite">
  <!-- setup -->
  <div class="st-setup">
    <h2>🎯 Test yourself</h2>
    <div class="group-label">Where?</div>
    <div class="seg">
      <button data-scope="world">🌍 World countries</button>
      <button data-scope="india">🇮🇳 India states</button>
    </div>
    <div class="group-label">What?</div>
    <div class="seg">
      <button data-type="find">📍 Find it on the map</button>
      <button data-type="capital">🏛️ Pick the capital</button>
    </div>
    <button class="primary start">Start · 10 questions</button>
  </div>
  <!-- question -->
  <div class="st-question">
    <div class="top">
      <span class="progress"></span>
      <span class="score"></span>
    </div>
    <div class="prompt-row">
      <span class="flag"></span>
      <div class="prompt"></div>
      <button class="repeat" title="Hear the question again" aria-label="Hear the question again"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z" fill="currentColor"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg></button>
    </div>
    <div class="hint"></div>
    <div class="choices"></div>
    <div class="feedback"></div>
    <div class="bottom">
      <button class="link quit">Quit</button>
      <button class="primary next" hidden>Next →</button>
    </div>
  </div>
  <!-- results -->
  <div class="st-done">
    <div class="stars"></div>
    <div class="result"></div>
    <div class="result-msg"></div>
    <div class="bottom">
      <button class="link change">Change test</button>
      <button class="primary again">Play again</button>
    </div>
  </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
<script src="data/world.js"></script>
<script src="data/countries.js"></script>
<script src="data/india.js"></script>
<script src="data/india-states.js"></script>
<script src="app.js"></script>
<script src="quiz.js"></script>
</body>
</html>
